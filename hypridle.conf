# Hypridle configuration — MANAGED BY OMARCHY PLUGIN io.github.jfdnet.auto-power
# This file is installed by the "Omarchy Auto Power" plugin.
# To change the power policy, edit the plugin's own copy instead:
#   ~/.config/omarchy/plugins/io.github.jfdnet.auto-power/hypridle.conf
# Disabling the plugin restores the original config from:
#   hypridle.conf.omarchy-auto-power-backup
#
# 屏保 3min + 锁屏 5min：由 Omarchy shell idle 插件处理（~/.config/omarchy/shell.json）
# 该插件会忽略屏保开窗口造成的假活动，锁不会被重置。
# hypridle 只负责休眠/关机，以及睡眠前后的锁屏与亮屏。
# stay-awake：~/.local/state/omarchy/indicators/stay-awake
# condition_cmd: exit 0 = 执行, 非零 = 跳过

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; /usr/local/bin/omarchy-auto-theme
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; /usr/local/bin/omarchy-auto-theme
    ignore_dbus_inhibit = true
}

# 10 分钟：休眠（仅电池；插电或 stay-awake 时跳过）
listener {
    timeout = 600
    on-timeout = bash -lc 'if [[ $(cat /sys/class/power_supply/AC0/online 2>/dev/null) == "1" ]]; then exit 0; fi; systemctl suspend'
    condition_cmd = test ! -f ~/.local/state/omarchy/indicators/stay-awake
}

# 30 分钟：关机（仅电池；插电或 stay-awake 时跳过）
listener {
    timeout = 1800
    on-timeout = bash -lc 'if [[ $(cat /sys/class/power_supply/AC0/online 2>/dev/null) == "1" ]]; then exit 0; fi; systemctl poweroff'
    condition_cmd = test ! -f ~/.local/state/omarchy/indicators/stay-awake
}
